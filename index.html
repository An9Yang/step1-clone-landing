<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Step1 - Design Cloning Tool</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        // Semantic colors (Neo-Glassmorphic Dark Theme)
                        background: "#09090b",
                        foreground: "#fafafa",
                        card: "#18181b",
                        "card-foreground": "#fafafa",
                        muted: "#27272a",
                        "muted-foreground": "#a1a1aa",
                        primary: "#00d294",
                        "primary-foreground": "#022c22",
                        secondary: "#27272a",
                        "secondary-foreground": "#fafafa",
                        border: "#27272a",
                        input: "#27272a",
                        ring: "#00d294",
                        destructive: "#ef4444",
                        // Legacy mappings for compatibility
                        "background-light": "#09090b",
                        "surface-light": "#18181b",
                        "text-primary": "#fafafa",
                        "text-secondary": "#a1a1aa",
                        "border-light": "#27272a",
                    },
                    fontFamily: {
                        display: ["Darker Grotesque", "Inter", "sans-serif"],
                        sans: ["Inter", "sans-serif"],
                        mono: ["Fira Code", "monospace"],
                    },
                    borderRadius: {
                        DEFAULT: "0.5rem",
                        "2xl": "1rem",
                        "3xl": "1.5rem",
                    },
                    boxShadow: {
                        // Dark theme shadow system
                        'xs': '0 1px 2px rgba(0,0,0,0.4)',
                        'sm': '0 1px 3px rgba(0,0,0,0.5), 0 1px 2px rgba(0,0,0,0.4)',
                        'md': '0 4px 6px rgba(0,0,0,0.5), 0 2px 4px rgba(0,0,0,0.4)',
                        'lg': '0 10px 15px rgba(0,0,0,0.5), 0 4px 6px rgba(0,0,0,0.4)',
                        'xl': '0 20px 25px rgba(0,0,0,0.5), 0 8px 10px rgba(0,0,0,0.4)',
                        '2xl': '0 25px 50px rgba(0,0,0,0.6)',
                        // Elevation aliases (updated for dark)
                        'elevation-1': '0 1px 3px rgba(0,0,0,0.5), 0 1px 2px rgba(0,0,0,0.4)',
                        'elevation-2': '0 4px 6px rgba(0,0,0,0.5), 0 2px 4px rgba(0,0,0,0.4)',
                        'elevation-3': '0 10px 15px rgba(0,0,0,0.5), 0 4px 6px rgba(0,0,0,0.4)',
                        'elevation-4': '0 20px 25px rgba(0,0,0,0.5), 0 8px 10px rgba(0,0,0,0.4)',
                        // Glass effect glow
                        'glow-primary': '0 0 20px rgba(0,210,148,0.3)',
                        'glow-primary-lg': '0 0 40px rgba(0,210,148,0.4)',
                    },
                    transitionTimingFunction: {
                        'smooth': 'cubic-bezier(0.4, 0, 0.2, 1)',
                        'smooth-in': 'cubic-bezier(0.4, 0, 1, 1)',
                        'smooth-out': 'cubic-bezier(0, 0, 0.2, 1)',
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 6s ease-in-out infinite',
                        'shine': 'shine 1.5s ease-in-out infinite',
                        'glow': 'glow 2s ease-in-out infinite alternate',
                        'gradient-flow': 'gradient-flow 4s ease infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        shine: {
                            '0%': { left: '-100%' },
                            '100%': { left: '200%' }
                        },
                        glow: {
                            '0%': { opacity: '0.3' },
                            '100%': { opacity: '0.6' }
                        },
                        'gradient-flow': {
                            '0%': { backgroundPosition: '0% 50%' },
                            '50%': { backgroundPosition: '100% 50%' },
                            '100%': { backgroundPosition: '0% 50%' }
                        }
                    },
                    backdropBlur: {
                        'xs': '2px',
                        'sm': '4px',
                        'md': '12px',
                        'lg': '16px',
                        'xl': '24px',
                    }
                },
            },
        };
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #09090b;
        }

        /* Dark scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #18181b;
        }
        ::-webkit-scrollbar-thumb {
            background: #3f3f46;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #52525b;
        }

        /* Hero gradient - dark emerald version */
        .hero-gradient-overlay {
            background: radial-gradient(circle at center, rgba(0, 210, 148, 0.12) 0%, rgba(9, 9, 11, 0) 70%);
        }

        /* Bento card - dark glass style */
        .bento-card {
            background: rgba(24, 24, 27, 0.8);
            border: 1px solid rgba(39, 39, 42, 0.8);
            box-shadow: 0 4px 6px rgba(0,0,0,0.5), 0 2px 4px rgba(0,0,0,0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(8px);
        }
        .bento-card:hover {
            box-shadow: 0 10px 15px rgba(0,0,0,0.5), 0 4px 6px rgba(0,0,0,0.4);
            border-color: rgba(0, 210, 148, 0.3);
        }

        /* Dark dots pattern */
        .bg-dots-pattern {
            background-image: radial-gradient(rgba(63, 63, 70, 0.5) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* Glass card utility */
        .glass-card {
            background: rgba(24, 24, 27, 0.5);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Glass header */
        .glass-header {
            background: rgba(9, 9, 11, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(39, 39, 42, 0.8);
        }

        /* Carousel */
        .carousel-container {
            perspective: 1200px;
            perspective-origin: center center;
        }
        .carousel-item {
            transform-style: preserve-3d;
            backface-visibility: hidden;
            transition: all 500ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Primary button glow on hover */
        .btn-primary-glow:hover {
            box-shadow: 0 0 20px rgba(0, 210, 148, 0.4);
        }

        /* Selection color */
        ::selection {
            background: rgba(0, 210, 148, 0.3);
            color: #fafafa;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-background text-foreground transition-colors duration-300 antialiased">
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
