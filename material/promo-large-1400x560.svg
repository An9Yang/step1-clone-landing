<svg width="1400" height="560" viewBox="0 0 1400 560" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Yellow radial gradient -->
    <radialGradient id="yellowGlowLarge" cx="30%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#facc15" stop-opacity="0"/>
    </radialGradient>

    <!-- Blue radial gradient -->
    <radialGradient id="blueGlowLarge" cx="70%" cy="70%" r="40%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <!-- Dot pattern -->
    <pattern id="dotsLarge" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#cbd5e1" opacity="0.4"/>
    </pattern>

    <!-- Shadow filter -->
    <filter id="shadowLarge" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1400" height="560" fill="#fafafa"/>
  <rect width="1400" height="560" fill="url(#dotsLarge)"/>
  <ellipse cx="300" cy="200" rx="400" ry="350" fill="url(#yellowGlowLarge)"/>
  <ellipse cx="1100" cy="400" rx="300" ry="250" fill="url(#blueGlowLarge)"/>

  <!-- Decorative elements in edge areas (can be cropped) -->
  <!-- Left edge: Browser mockup partial -->
  <g transform="translate(-100, 180)" opacity="0.6" filter="url(#shadowLarge)">
    <rect width="200" height="200" rx="12" fill="white"/>
    <rect width="200" height="32" rx="12" fill="#f8fafc"/>
    <circle cx="20" cy="16" r="5" fill="#f87171"/>
    <circle cx="38" cy="16" r="5" fill="#fbbf24"/>
    <circle cx="56" cy="16" r="5" fill="#4ade80"/>
    <rect x="16" y="48" width="168" height="136" rx="6" fill="#f1f5f9"/>
    <rect x="32" y="64" width="80" height="12" rx="3" fill="#e2e8f0"/>
    <rect x="32" y="84" width="120" height="16" rx="4" fill="#0f172a"/>
    <rect x="32" y="108" width="100" height="8" rx="2" fill="#94a3b8"/>
  </g>

  <!-- Right edge: Code editor partial -->
  <g transform="translate(1300, 160)" opacity="0.6" filter="url(#shadowLarge)">
    <rect width="200" height="240" rx="12" fill="#0f172a"/>
    <rect width="200" height="28" rx="12" fill="#1e293b"/>
    <text x="20" y="60" font-family="Fira Code, monospace" font-size="10" fill="#7c3aed">&lt;div</text>
    <text x="20" y="78" font-family="Fira Code, monospace" font-size="10" fill="#22d3ee">  class=</text>
    <text x="20" y="96" font-family="Fira Code, monospace" font-size="10" fill="#a3e635">"flex"</text>
  </g>

  <!-- Safe area content (1024x324 centered at 188, 118) -->
  <g transform="translate(188, 118)">
    <!-- Logo + Brand name row -->
    <g transform="translate(356, 0)">
      <!-- Logo -->
      <g filter="url(#shadowLarge)">
        <rect width="72" height="72" rx="16" fill="white"/>
        <path d="M22 30.4L41.8 22L50 41.8"
              stroke="black"
              stroke-width="4.2"
              stroke-linecap="round"
              stroke-linejoin="round"/>
        <path d="M30.4 50L41.8 22"
              stroke="black"
              stroke-width="4.2"
              stroke-linecap="round"
              stroke-linejoin="round"/>
      </g>

      <!-- Brand name -->
      <text x="92" y="50" font-family="Inter, sans-serif" font-size="40" font-weight="700" fill="#0f172a">Step1</text>
    </g>

    <!-- Main headline -->
    <text x="512" y="140" text-anchor="middle" font-family="Inter, sans-serif" font-size="48" font-weight="700" fill="#0f172a">Clone Any Design in Seconds</text>

    <!-- Subheadline -->
    <text x="512" y="185" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" fill="#475569">Copy styles from any site, make them yours.</text>

    <!-- Four feature icons -->
    <g transform="translate(112, 230)">
      <!-- Site Clone -->
      <g>
        <circle cx="24" cy="24" r="24" fill="rgba(250, 204, 21, 0.15)"/>
        <circle cx="24" cy="24" r="12" fill="#facc15"/>
        <path d="M19 24L24 19L29 24L24 29Z" fill="white"/>
        <text x="60" y="20" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Site Clone</text>
        <text x="60" y="36" font-family="Inter, sans-serif" font-size="12" fill="#64748b">Full pages</text>
      </g>

      <!-- Component Clone -->
      <g transform="translate(200, 0)">
        <circle cx="24" cy="24" r="24" fill="rgba(59, 130, 246, 0.15)"/>
        <circle cx="24" cy="24" r="12" fill="#3b82f6"/>
        <rect x="18" y="18" width="5" height="5" rx="1" fill="white"/>
        <rect x="25" y="18" width="5" height="5" rx="1" fill="white"/>
        <rect x="18" y="25" width="5" height="5" rx="1" fill="white"/>
        <rect x="25" y="25" width="5" height="5" rx="1" fill="white"/>
        <text x="60" y="20" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Components</text>
        <text x="60" y="36" font-family="Inter, sans-serif" font-size="12" fill="#64748b">Any element</text>
      </g>

      <!-- Visual Edit -->
      <g transform="translate(400, 0)">
        <circle cx="24" cy="24" r="24" fill="rgba(147, 51, 234, 0.15)"/>
        <circle cx="24" cy="24" r="12" fill="#9333ea"/>
        <path d="M20 24L24 20L28 24L24 28Z" fill="white"/>
        <circle cx="24" cy="24" r="3" fill="#9333ea"/>
        <text x="60" y="20" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Visual Edit</text>
        <text x="60" y="36" font-family="Inter, sans-serif" font-size="12" fill="#64748b">No code</text>
      </g>

      <!-- Style Extraction -->
      <g transform="translate(600, 0)">
        <circle cx="24" cy="24" r="24" fill="rgba(34, 197, 94, 0.15)"/>
        <circle cx="24" cy="24" r="12" fill="#22c55e"/>
        <circle cx="20" cy="21" r="3" fill="white"/>
        <circle cx="28" cy="21" r="3" fill="white"/>
        <circle cx="24" cy="28" r="3" fill="white"/>
        <text x="60" y="20" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Style Extract</text>
        <text x="60" y="36" font-family="Inter, sans-serif" font-size="12" fill="#64748b">Design tokens</text>
      </g>
    </g>
  </g>

  <!-- Chrome Web Store badge hint -->
  <g transform="translate(610, 480)">
    <rect width="180" height="40" rx="8" fill="white" filter="url(#shadowLarge)"/>
    <!-- Chrome icon simplified -->
    <circle cx="28" cy="20" r="12" fill="#4285f4"/>
    <circle cx="28" cy="20" r="5" fill="white"/>
    <circle cx="28" cy="20" r="3" fill="#4285f4"/>
    <text x="50" y="25" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#0f172a">Available on Chrome</text>
  </g>
</svg>
