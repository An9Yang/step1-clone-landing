<svg width="1280" height="800" viewBox="0 0 1280 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Yellow radial gradient -->
    <radialGradient id="yellowGlowLeft" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#facc15" stop-opacity="0"/>
    </radialGradient>

    <!-- Dot pattern -->
    <pattern id="dots2" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#cbd5e1" opacity="0.4"/>
    </pattern>

    <!-- Shadow filter -->
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="800" fill="#fafafa"/>
  <rect width="1280" height="800" fill="url(#dots2)"/>
  <ellipse cx="200" cy="300" rx="400" ry="350" fill="url(#yellowGlowLeft)"/>

  <!-- Left side: Feature description -->
  <g transform="translate(80, 180)">
    <!-- Feature badge -->
    <rect width="120" height="36" rx="18" fill="rgba(250, 204, 21, 0.15)"/>
    <circle cx="20" cy="18" r="10" fill="#facc15"/>
    <text x="40" y="23" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Site Clone</text>

    <!-- Main title -->
    <text y="100" font-family="Inter, sans-serif" font-size="44" font-weight="700" fill="#0f172a">Full Site Clone</text>

    <!-- Subtitle -->
    <text y="150" font-family="Inter, sans-serif" font-size="18" fill="#475569">Capture entire websites with</text>
    <text y="178" font-family="Inter, sans-serif" font-size="18" fill="#475569">a single click.</text>

    <!-- Feature list -->
    <g transform="translate(0, 230)">
      <!-- Feature 1 -->
      <circle cx="14" cy="14" r="14" fill="rgba(250, 204, 21, 0.2)"/>
      <path d="M8 14L12 18L20 10" stroke="#facc15" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="40" y="19" font-family="Inter, sans-serif" font-size="16" fill="#0f172a">Complete HTML/CSS export</text>

      <!-- Feature 2 -->
      <g transform="translate(0, 50)">
        <circle cx="14" cy="14" r="14" fill="rgba(250, 204, 21, 0.2)"/>
        <path d="M8 14L12 18L20 10" stroke="#facc15" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="40" y="19" font-family="Inter, sans-serif" font-size="16" fill="#0f172a">Responsive layouts preserved</text>
      </g>

      <!-- Feature 3 -->
      <g transform="translate(0, 100)">
        <circle cx="14" cy="14" r="14" fill="rgba(250, 204, 21, 0.2)"/>
        <path d="M8 14L12 18L20 10" stroke="#facc15" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="40" y="19" font-family="Inter, sans-serif" font-size="16" fill="#0f172a">Editable output files</text>
      </g>
    </g>
  </g>

  <!-- Right side: Visual demo -->
  <g transform="translate(560, 80)" filter="url(#shadow2)">
    <!-- Source browser -->
    <g>
      <rect width="600" height="360" rx="12" fill="white"/>

      <!-- Browser top bar -->
      <rect width="600" height="40" rx="12" fill="#f1f5f9"/>
      <rect y="28" width="600" height="12" fill="#f1f5f9"/>

      <!-- Traffic lights -->
      <circle cx="20" cy="20" r="5" fill="#f87171"/>
      <circle cx="40" cy="20" r="5" fill="#fbbf24"/>
      <circle cx="60" cy="20" r="5" fill="#4ade80"/>

      <!-- URL bar -->
      <rect x="80" y="10" width="440" height="20" rx="4" fill="#e2e8f0"/>
      <text x="95" y="24" font-family="Inter, sans-serif" font-size="11" fill="#64748b">stripe.com</text>

      <!-- Website preview content -->
      <rect x="20" y="56" width="560" height="284" rx="6" fill="#f8fafc"/>

      <!-- Mock Stripe-like layout -->
      <rect x="40" y="80" width="160" height="20" rx="4" fill="#635bff"/>
      <rect x="40" y="120" width="280" height="36" rx="4" fill="#0f172a"/>
      <rect x="40" y="170" width="200" height="12" rx="3" fill="#94a3b8"/>
      <rect x="40" y="190" width="240" height="12" rx="3" fill="#94a3b8"/>

      <rect x="40" y="230" width="100" height="36" rx="6" fill="#635bff"/>
      <rect x="156" y="230" width="100" height="36" rx="6" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>

      <!-- Card preview -->
      <rect x="360" y="80" width="200" height="180" rx="10" fill="white" stroke="#e2e8f0"/>
      <rect x="380" y="100" width="160" height="80" rx="6" fill="#f1f5f9"/>
      <rect x="380" y="196" width="100" height="12" rx="3" fill="#e2e8f0"/>
      <rect x="380" y="216" width="80" height="12" rx="3" fill="#e2e8f0"/>

      <!-- Selection highlight -->
      <rect x="16" y="52" width="568" height="292" rx="8" fill="none" stroke="#facc15" stroke-width="3" stroke-dasharray="10 5"/>
    </g>

    <!-- Arrow -->
    <g transform="translate(270, 380)">
      <rect x="0" y="10" width="60" height="4" rx="2" fill="#facc15"/>
      <path d="M52 0L68 14L52 28" fill="none" stroke="#facc15" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Code editor output -->
    <g transform="translate(0, 420)">
      <rect width="600" height="260" rx="12" fill="#0f172a"/>

      <!-- Editor top bar -->
      <rect width="600" height="36" rx="12" fill="#1e293b"/>
      <rect y="24" width="600" height="12" fill="#1e293b"/>

      <!-- Tab -->
      <rect x="12" y="8" width="100" height="20" rx="4" fill="#0f172a"/>
      <text x="26" y="22" font-family="Fira Code, monospace" font-size="11" fill="#94a3b8">index.html</text>

      <!-- Code content -->
      <text x="24" y="64" font-family="Fira Code, monospace" font-size="12">
        <tspan fill="#7c3aed">&lt;!DOCTYPE</tspan><tspan fill="#94a3b8"> html&gt;</tspan>
      </text>
      <text x="24" y="84" font-family="Fira Code, monospace" font-size="12">
        <tspan fill="#7c3aed">&lt;html</tspan><tspan fill="#94a3b8">&gt;</tspan>
      </text>
      <text x="24" y="104" font-family="Fira Code, monospace" font-size="12">
        <tspan fill="#7c3aed">  &lt;head&gt;</tspan>
      </text>
      <text x="24" y="124" font-family="Fira Code, monospace" font-size="12">
        <tspan fill="#94a3b8">    </tspan><tspan fill="#7c3aed">&lt;link</tspan><tspan fill="#22d3ee"> rel</tspan><tspan fill="#94a3b8">=</tspan><tspan fill="#a3e635">"stylesheet"</tspan><tspan fill="#94a3b8"> ...</tspan><tspan fill="#7c3aed">/&gt;</tspan>
      </text>
      <text x="24" y="144" font-family="Fira Code, monospace" font-size="12">
        <tspan fill="#7c3aed">  &lt;/head&gt;</tspan>
      </text>
      <text x="24" y="164" font-family="Fira Code, monospace" font-size="12">
        <tspan fill="#7c3aed">  &lt;body</tspan><tspan fill="#22d3ee"> class</tspan><tspan fill="#94a3b8">=</tspan><tspan fill="#a3e635">"min-h-screen"</tspan><tspan fill="#7c3aed">&gt;</tspan>
      </text>
      <text x="24" y="184" font-family="Fira Code, monospace" font-size="12">
        <tspan fill="#94a3b8">    </tspan><tspan fill="#7c3aed">&lt;header</tspan><tspan fill="#22d3ee"> class</tspan><tspan fill="#94a3b8">=</tspan><tspan fill="#a3e635">"flex..."</tspan><tspan fill="#7c3aed">&gt;</tspan>
      </text>
      <text x="24" y="204" font-family="Fira Code, monospace" font-size="12">
        <tspan fill="#94a3b8">      </tspan><tspan fill="#64748b">// Cloned content...</tspan>
      </text>

      <!-- Line numbers -->
      <text x="8" y="64" font-family="Fira Code, monospace" font-size="10" fill="#475569">1</text>
      <text x="8" y="84" font-family="Fira Code, monospace" font-size="10" fill="#475569">2</text>
      <text x="8" y="104" font-family="Fira Code, monospace" font-size="10" fill="#475569">3</text>
      <text x="8" y="124" font-family="Fira Code, monospace" font-size="10" fill="#475569">4</text>
      <text x="8" y="144" font-family="Fira Code, monospace" font-size="10" fill="#475569">5</text>
      <text x="8" y="164" font-family="Fira Code, monospace" font-size="10" fill="#475569">6</text>
      <text x="8" y="184" font-family="Fira Code, monospace" font-size="10" fill="#475569">7</text>
      <text x="8" y="204" font-family="Fira Code, monospace" font-size="10" fill="#475569">8</text>
    </g>
  </g>

  <!-- Clone button indicator -->
  <g transform="translate(1060, 400)">
    <rect width="100" height="40" rx="20" fill="#facc15" filter="url(#shadow2)"/>
    <text x="50" y="26" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Clone</text>
  </g>
</svg>
