<svg width="1280" height="800" viewBox="0 0 1280 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Blue radial gradient -->
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <!-- Dot pattern -->
    <pattern id="dots3" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#cbd5e1" opacity="0.4"/>
    </pattern>

    <!-- Shadow filter -->
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.1"/>
    </filter>

    <filter id="shadowSmall3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="800" fill="#fafafa"/>
  <rect width="1280" height="800" fill="url(#dots3)"/>
  <ellipse cx="640" cy="400" rx="600" ry="400" fill="url(#blueGlow)"/>

  <!-- Header -->
  <text x="640" y="80" text-anchor="middle" font-family="Inter, sans-serif" font-size="44" font-weight="700" fill="#0f172a">Extract Any Component</text>
  <text x="640" y="120" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" fill="#475569">Grab buttons, cards, navbars - any element you need.</text>

  <!-- Main browser mockup with multiple selections -->
  <g transform="translate(100, 160)" filter="url(#shadow3)">
    <rect width="700" height="520" rx="16" fill="white"/>

    <!-- Browser top bar -->
    <rect width="700" height="44" rx="16" fill="#f8fafc"/>
    <rect y="32" width="700" height="12" fill="#f8fafc"/>

    <!-- Traffic lights -->
    <circle cx="22" cy="22" r="6" fill="#f87171"/>
    <circle cx="44" cy="22" r="6" fill="#fbbf24"/>
    <circle cx="66" cy="22" r="6" fill="#4ade80"/>

    <!-- URL bar -->
    <rect x="90" y="11" width="520" height="22" rx="6" fill="#e2e8f0"/>
    <text x="105" y="27" font-family="Inter, sans-serif" font-size="11" fill="#64748b">linear.app</text>

    <!-- Website content -->
    <rect x="20" y="60" width="660" height="440" rx="8" fill="#fafafa"/>

    <!-- Navigation bar -->
    <rect x="40" y="80" width="620" height="48" rx="8" fill="white" stroke="#e2e8f0"/>
    <rect x="60" y="96" width="60" height="16" rx="4" fill="#0f172a"/>
    <rect x="140" y="96" width="40" height="16" rx="4" fill="#94a3b8"/>
    <rect x="200" y="96" width="50" height="16" rx="4" fill="#94a3b8"/>
    <rect x="270" y="96" width="45" height="16" rx="4" fill="#94a3b8"/>
    <rect x="560" y="90" width="80" height="28" rx="6" fill="#5b21b6"/>

    <!-- Selection on navbar -->
    <rect x="36" y="76" width="628" height="56" rx="10" fill="none" stroke="#3b82f6" stroke-width="3" stroke-dasharray="8 4"/>
    <rect x="32" y="72" width="12" height="12" rx="2" fill="#3b82f6"/>
    <rect x="656" y="72" width="12" height="12" rx="2" fill="#3b82f6"/>
    <rect x="32" y="124" width="12" height="12" rx="2" fill="#3b82f6"/>
    <rect x="656" y="124" width="12" height="12" rx="2" fill="#3b82f6"/>

    <!-- Label for navbar -->
    <g transform="translate(600, 56)">
      <rect width="80" height="24" rx="4" fill="#3b82f6"/>
      <text x="40" y="16" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="white">Navbar</text>
    </g>

    <!-- Hero section mock -->
    <rect x="40" y="150" width="400" height="32" rx="6" fill="#0f172a"/>
    <rect x="40" y="195" width="320" height="14" rx="4" fill="#94a3b8"/>
    <rect x="40" y="220" width="280" height="14" rx="4" fill="#94a3b8"/>

    <!-- Button group -->
    <rect x="40" y="260" width="100" height="40" rx="8" fill="#5b21b6"/>
    <rect x="156" y="260" width="100" height="40" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- Selection on button -->
    <rect x="36" y="256" width="108" height="48" rx="10" fill="none" stroke="#3b82f6" stroke-width="3" stroke-dasharray="8 4"/>
    <rect x="32" y="252" width="12" height="12" rx="2" fill="#3b82f6"/>
    <rect x="136" y="252" width="12" height="12" rx="2" fill="#3b82f6"/>
    <rect x="32" y="296" width="12" height="12" rx="2" fill="#3b82f6"/>
    <rect x="136" y="296" width="12" height="12" rx="2" fill="#3b82f6"/>

    <!-- Label for button -->
    <g transform="translate(100, 238)">
      <rect width="64" height="24" rx="4" fill="#3b82f6"/>
      <text x="32" y="16" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="white">Button</text>
    </g>

    <!-- Cards grid -->
    <rect x="40" y="340" width="190" height="140" rx="12" fill="white" stroke="#e2e8f0"/>
    <rect x="60" y="360" width="150" height="60" rx="6" fill="#f1f5f9"/>
    <rect x="60" y="435" width="100" height="12" rx="4" fill="#e2e8f0"/>
    <rect x="60" y="455" width="80" height="12" rx="4" fill="#e2e8f0"/>

    <rect x="250" y="340" width="190" height="140" rx="12" fill="white" stroke="#e2e8f0"/>
    <rect x="270" y="360" width="150" height="60" rx="6" fill="#f1f5f9"/>
    <rect x="270" y="435" width="100" height="12" rx="4" fill="#e2e8f0"/>
    <rect x="270" y="455" width="80" height="12" rx="4" fill="#e2e8f0"/>

    <rect x="460" y="340" width="190" height="140" rx="12" fill="white" stroke="#e2e8f0"/>
    <rect x="480" y="360" width="150" height="60" rx="6" fill="#f1f5f9"/>
    <rect x="480" y="435" width="100" height="12" rx="4" fill="#e2e8f0"/>
    <rect x="480" y="455" width="80" height="12" rx="4" fill="#e2e8f0"/>

    <!-- Selection on first card -->
    <rect x="36" y="336" width="198" height="148" rx="14" fill="none" stroke="#3b82f6" stroke-width="3" stroke-dasharray="8 4"/>
    <rect x="32" y="332" width="12" height="12" rx="2" fill="#3b82f6"/>
    <rect x="226" y="332" width="12" height="12" rx="2" fill="#3b82f6"/>
    <rect x="32" y="476" width="12" height="12" rx="2" fill="#3b82f6"/>
    <rect x="226" y="476" width="12" height="12" rx="2" fill="#3b82f6"/>

    <!-- Label for card -->
    <g transform="translate(178, 318)">
      <rect width="56" height="24" rx="4" fill="#3b82f6"/>
      <text x="28" y="16" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="white">Card</text>
    </g>
  </g>

  <!-- Extracted components panel -->
  <g transform="translate(860, 180)" filter="url(#shadowSmall3)">
    <rect width="340" height="480" rx="16" fill="white"/>

    <!-- Panel header -->
    <rect width="340" height="56" rx="16" fill="#f8fafc"/>
    <rect y="40" width="340" height="16" fill="#f8fafc"/>
    <text x="24" y="36" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#0f172a">Extracted Components</text>
    <text x="280" y="36" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#3b82f6">3 items</text>

    <!-- Extracted component 1: Navbar -->
    <g transform="translate(20, 72)">
      <rect width="300" height="100" rx="10" fill="#fafafa" stroke="#e2e8f0"/>
      <rect x="16" y="16" width="268" height="32" rx="6" fill="white" stroke="#e2e8f0"/>
      <rect x="28" y="26" width="40" height="12" rx="3" fill="#0f172a"/>
      <rect x="80" y="26" width="30" height="12" rx="3" fill="#94a3b8"/>
      <rect x="120" y="26" width="35" height="12" rx="3" fill="#94a3b8"/>
      <rect x="226" y="22" width="46" height="20" rx="4" fill="#5b21b6"/>

      <text x="16" y="72" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#0f172a">Navbar</text>
      <text x="16" y="88" font-family="Fira Code, monospace" font-size="10" fill="#64748b">&lt;nav class="flex..."&gt;</text>
    </g>

    <!-- Extracted component 2: Button -->
    <g transform="translate(20, 188)">
      <rect width="300" height="100" rx="10" fill="#fafafa" stroke="#e2e8f0"/>
      <rect x="100" y="20" width="100" height="36" rx="8" fill="#5b21b6"/>
      <text x="150" y="44" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="white">Get Started</text>

      <text x="16" y="72" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#0f172a">Primary Button</text>
      <text x="16" y="88" font-family="Fira Code, monospace" font-size="10" fill="#64748b">&lt;button class="bg-..."&gt;</text>
    </g>

    <!-- Extracted component 3: Card -->
    <g transform="translate(20, 304)">
      <rect width="300" height="120" rx="10" fill="#fafafa" stroke="#e2e8f0"/>
      <rect x="90" y="12" width="120" height="72" rx="8" fill="white" stroke="#e2e8f0"/>
      <rect x="102" y="24" width="96" height="32" rx="4" fill="#f1f5f9"/>
      <rect x="102" y="62" width="60" height="8" rx="2" fill="#e2e8f0"/>
      <rect x="102" y="74" width="48" height="8" rx="2" fill="#e2e8f0"/>

      <text x="16" y="92" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#0f172a">Feature Card</text>
      <text x="16" y="108" font-family="Fira Code, monospace" font-size="10" fill="#64748b">&lt;div class="rounded-xl..."&gt;</text>
    </g>

    <!-- Export button -->
    <g transform="translate(20, 440)">
      <rect width="300" height="44" rx="8" fill="#3b82f6"/>
      <text x="150" y="28" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="white">Export All Components</text>
    </g>
  </g>

  <!-- Cursor pointer -->
  <g transform="translate(180, 290)">
    <path d="M0 0L0 24L6 18L12 30L16 28L10 16L18 16Z" fill="#0f172a" stroke="white" stroke-width="1.5"/>
  </g>
</svg>
