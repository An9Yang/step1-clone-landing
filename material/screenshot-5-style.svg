<svg width="1280" height="800" viewBox="0 0 1280 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Green radial gradient -->
    <radialGradient id="greenGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>

    <!-- Dot pattern -->
    <pattern id="dots5" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#cbd5e1" opacity="0.4"/>
    </pattern>

    <!-- Shadow filter -->
    <filter id="shadow5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.1"/>
    </filter>

    <filter id="shadowSmall5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="800" fill="#fafafa"/>
  <rect width="1280" height="800" fill="url(#dots5)"/>
  <ellipse cx="640" cy="400" rx="600" ry="400" fill="url(#greenGlow)"/>

  <!-- Header -->
  <text x="640" y="80" text-anchor="middle" font-family="Inter, sans-serif" font-size="44" font-weight="700" fill="#0f172a">Design Tokens, Instantly</text>
  <text x="640" y="120" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" fill="#475569">Extract colors, fonts, and spacing from any site.</text>

  <!-- Main style extraction panel -->
  <g transform="translate(160, 160)" filter="url(#shadow5)">
    <rect width="960" height="520" rx="20" fill="white"/>

    <!-- Panel header -->
    <rect width="960" height="64" rx="20" fill="#f8fafc"/>
    <rect y="48" width="960" height="16" fill="#f8fafc"/>

    <!-- Success badge -->
    <g transform="translate(24, 18)">
      <circle cx="14" cy="14" r="14" fill="#22c55e"/>
      <path d="M8 14L12 18L20 10" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="60" y="38" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#0f172a">Style Extracted from stripe.com</text>

    <!-- Source info -->
    <g transform="translate(780, 18)">
      <rect width="156" height="28" rx="14" fill="#f1f5f9"/>
      <text x="78" y="19" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#64748b">5 design tokens</text>
    </g>

    <!-- Color Palette Section -->
    <g transform="translate(40, 90)">
      <text font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#64748b" letter-spacing="0.05em">COLOR PALETTE</text>

      <g transform="translate(0, 24)">
        <!-- Color 1 -->
        <g>
          <rect width="160" height="100" rx="12" fill="#635bff"/>
          <text x="16" y="80" font-family="Fira Code, monospace" font-size="11" fill="white" opacity="0.8">#635BFF</text>
          <text x="16" y="92" font-family="Inter, sans-serif" font-size="10" fill="white" opacity="0.6">Primary</text>
        </g>

        <!-- Color 2 -->
        <g transform="translate(176, 0)">
          <rect width="160" height="100" rx="12" fill="#0a2540"/>
          <text x="16" y="80" font-family="Fira Code, monospace" font-size="11" fill="white" opacity="0.8">#0A2540</text>
          <text x="16" y="92" font-family="Inter, sans-serif" font-size="10" fill="white" opacity="0.6">Text</text>
        </g>

        <!-- Color 3 -->
        <g transform="translate(352, 0)">
          <rect width="160" height="100" rx="12" fill="#425466"/>
          <text x="16" y="80" font-family="Fira Code, monospace" font-size="11" fill="white" opacity="0.8">#425466</text>
          <text x="16" y="92" font-family="Inter, sans-serif" font-size="10" fill="white" opacity="0.6">Secondary</text>
        </g>

        <!-- Color 4 -->
        <g transform="translate(528, 0)">
          <rect width="160" height="100" rx="12" fill="#f6f9fc"/>
          <text x="16" y="80" font-family="Fira Code, monospace" font-size="11" fill="#64748b">#F6F9FC</text>
          <text x="16" y="92" font-family="Inter, sans-serif" font-size="10" fill="#94a3b8">Background</text>
        </g>

        <!-- Color 5 -->
        <g transform="translate(704, 0)">
          <rect width="160" height="100" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
          <text x="16" y="80" font-family="Fira Code, monospace" font-size="11" fill="#64748b">#FFFFFF</text>
          <text x="16" y="92" font-family="Inter, sans-serif" font-size="10" fill="#94a3b8">Surface</text>
        </g>
      </g>
    </g>

    <!-- Typography Section -->
    <g transform="translate(40, 240)">
      <text font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#64748b" letter-spacing="0.05em">TYPOGRAPHY</text>

      <g transform="translate(0, 24)">
        <!-- Font 1 -->
        <g>
          <rect width="280" height="90" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
          <text x="20" y="36" font-family="Inter, sans-serif" font-size="24" font-weight="600" fill="#0f172a">SF Pro Display</text>
          <text x="20" y="60" font-family="Inter, sans-serif" font-size="13" fill="#64748b">Headings · 600 weight</text>
          <text x="20" y="78" font-family="Fira Code, monospace" font-size="11" fill="#94a3b8">font-family: "SF Pro Display"</text>
        </g>

        <!-- Font 2 -->
        <g transform="translate(300, 0)">
          <rect width="280" height="90" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
          <text x="20" y="36" font-family="Inter, sans-serif" font-size="24" fill="#0f172a">Inter</text>
          <text x="20" y="60" font-family="Inter, sans-serif" font-size="13" fill="#64748b">Body · 400 weight</text>
          <text x="20" y="78" font-family="Fira Code, monospace" font-size="11" fill="#94a3b8">font-family: "Inter"</text>
        </g>

        <!-- Font 3 -->
        <g transform="translate(600, 0)">
          <rect width="280" height="90" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
          <text x="20" y="36" font-family="Fira Code, monospace" font-size="20" fill="#0f172a">Fira Code</text>
          <text x="20" y="60" font-family="Inter, sans-serif" font-size="13" fill="#64748b">Code · 400 weight</text>
          <text x="20" y="78" font-family="Fira Code, monospace" font-size="11" fill="#94a3b8">font-family: "Fira Code"</text>
        </g>
      </g>
    </g>

    <!-- Spacing & Radius Section -->
    <g transform="translate(40, 380)">
      <text font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#64748b" letter-spacing="0.05em">SPACING & RADIUS</text>

      <g transform="translate(0, 24)">
        <!-- Radius examples -->
        <g>
          <rect width="200" height="80" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
          <text x="16" y="28" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#64748b">Border Radius</text>

          <rect x="16" y="40" width="32" height="32" rx="4" fill="none" stroke="#0f172a" stroke-width="2"/>
          <text x="16" y="86" font-family="Fira Code, monospace" font-size="9" fill="#94a3b8">4px</text>

          <rect x="64" y="40" width="32" height="32" rx="8" fill="none" stroke="#0f172a" stroke-width="2"/>
          <text x="64" y="86" font-family="Fira Code, monospace" font-size="9" fill="#94a3b8">8px</text>

          <rect x="112" y="40" width="32" height="32" rx="12" fill="none" stroke="#0f172a" stroke-width="2"/>
          <text x="112" y="86" font-family="Fira Code, monospace" font-size="9" fill="#94a3b8">12px</text>

          <rect x="160" y="40" width="32" height="32" rx="16" fill="none" stroke="#0f172a" stroke-width="2"/>
          <text x="160" y="86" font-family="Fira Code, monospace" font-size="9" fill="#94a3b8">16px</text>
        </g>

        <!-- Spacing examples -->
        <g transform="translate(220, 0)">
          <rect width="200" height="80" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
          <text x="16" y="28" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#64748b">Spacing Scale</text>

          <rect x="16" y="44" width="8" height="24" rx="2" fill="#22c55e"/>
          <text x="16" y="86" font-family="Fira Code, monospace" font-size="9" fill="#94a3b8">8</text>

          <rect x="40" y="44" width="16" height="24" rx="2" fill="#22c55e"/>
          <text x="40" y="86" font-family="Fira Code, monospace" font-size="9" fill="#94a3b8">16</text>

          <rect x="72" y="44" width="24" height="24" rx="2" fill="#22c55e"/>
          <text x="72" y="86" font-family="Fira Code, monospace" font-size="9" fill="#94a3b8">24</text>

          <rect x="112" y="44" width="32" height="24" rx="2" fill="#22c55e"/>
          <text x="112" y="86" font-family="Fira Code, monospace" font-size="9" fill="#94a3b8">32</text>

          <rect x="160" y="44" width="32" height="24" rx="2" fill="#22c55e"/>
          <text x="160" y="86" font-family="Fira Code, monospace" font-size="9" fill="#94a3b8">48</text>
        </g>

        <!-- Export buttons -->
        <g transform="translate(500, 0)">
          <rect width="180" height="36" rx="8" fill="#22c55e"/>
          <text x="90" y="23" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="white">Copy as CSS Variables</text>
        </g>

        <g transform="translate(700, 0)">
          <rect width="180" height="36" rx="8" fill="white" stroke="#e2e8f0"/>
          <text x="90" y="23" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#0f172a">Copy as Tailwind</text>
        </g>

        <g transform="translate(500, 44)">
          <rect width="180" height="36" rx="8" fill="white" stroke="#e2e8f0"/>
          <text x="90" y="23" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#0f172a">Export JSON</text>
        </g>

        <g transform="translate(700, 44)">
          <rect width="180" height="36" rx="8" fill="white" stroke="#e2e8f0"/>
          <text x="90" y="23" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#0f172a">Export Figma</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Copy success notification -->
  <g transform="translate(540, 700)" filter="url(#shadowSmall5)">
    <rect width="200" height="44" rx="22" fill="#0f172a"/>
    <circle cx="26" cy="22" r="12" fill="#22c55e"/>
    <path d="M20 22L24 26L32 18" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="50" y="27" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="white">Copied to clipboard!</text>
  </g>
</svg>
