<svg width="440" height="280" viewBox="0 0 440 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Yellow radial gradient -->
    <radialGradient id="yellowGlowSmall" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#facc15" stop-opacity="0"/>
    </radialGradient>

    <!-- Dot pattern -->
    <pattern id="dotsSmall" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="0.8" fill="#cbd5e1" opacity="0.5"/>
    </pattern>

    <!-- Shadow filter -->
    <filter id="shadowSmall" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="440" height="280" fill="#fafafa"/>
  <rect width="440" height="280" fill="url(#dotsSmall)"/>
  <ellipse cx="220" cy="120" rx="200" ry="180" fill="url(#yellowGlowSmall)"/>

  <!-- Logo -->
  <g transform="translate(180, 40)" filter="url(#shadowSmall)">
    <rect width="80" height="80" rx="18" fill="white"/>
    <!-- Logo paths scaled from 182 to 80 (ratio: 0.44) -->
    <path d="M24.5 33.4L46.2 24.5L55 46.2"
          stroke="black"
          stroke-width="4.7"
          stroke-linecap="round"
          stroke-linejoin="round"/>
    <path d="M33.4 55L46.2 24.5"
          stroke="black"
          stroke-width="4.7"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>

  <!-- Brand name -->
  <text x="220" y="148" text-anchor="middle" font-family="Inter, sans-serif" font-size="32" font-weight="700" fill="#0f172a">Step1</text>

  <!-- Tagline -->
  <text x="220" y="180" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" fill="#475569">Clone Any Design</text>

  <!-- Mini preview -->
  <g transform="translate(120, 200)" filter="url(#shadowSmall)">
    <rect width="200" height="60" rx="10" fill="white"/>

    <!-- Browser dots -->
    <circle cx="16" cy="14" r="3" fill="#f87171"/>
    <circle cx="28" cy="14" r="3" fill="#fbbf24"/>
    <circle cx="40" cy="14" r="3" fill="#4ade80"/>

    <!-- Mini website mockup -->
    <rect x="12" y="28" width="176" height="24" rx="4" fill="#f8fafc"/>

    <!-- Selection indicator -->
    <rect x="16" y="32" width="60" height="16" rx="3" fill="none" stroke="#facc15" stroke-width="1.5" stroke-dasharray="4 2"/>

    <!-- Style panel hint -->
    <rect x="100" y="32" width="80" height="16" rx="3" fill="#22c55e" opacity="0.2"/>
    <circle cx="110" cy="40" r="4" fill="#22c55e"/>
    <rect x="120" y="38" width="50" height="4" rx="1" fill="#22c55e" opacity="0.5"/>
  </g>
</svg>
